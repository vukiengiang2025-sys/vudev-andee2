pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        // Compose Multiplatform's Gradle plugin, for the desktop app.
        maven { url 'https://maven.pkg.jetbrains.space/public/p/compose/dev' }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // The dog's USB serial driver (usb-serial-for-android) is JitPack-only.
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "body"
include ':app'
include ':core'
include ':desktop'
